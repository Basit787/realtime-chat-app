# Dev stack: client (Vite HMR) + server (Nest watch) + MongoDB, MinIO and coturn. Start with `make`.
# Variables come from ./.env (see .env.example).

name: realtime-chat-app

services:
  # Replica set of one: Prisma needs transactions, which MongoDB only offers on a replica set
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once it answers
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      retries: 10

  minio:
    image: pgsty/minio:latest # minio/minio was removed from Docker Hub; community build
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:latest # minio/mc was removed from Docker Hub; community build
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-uploads}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local "http://$$MINIO_HOST" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb "local/$$MINIO_BUCKET" --ignore-existing
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "MinIO bucket '$$MINIO_BUCKET' is ready."

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USER:-chat}:${TURN_PASSWORD:-chatpass}
      --realm=realtime-chat
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}

  server:
    build:
      context: ./server
      target: dev
    restart: unless-stopped
    # `docker compose up --watch` rebuilds this image when dependencies, the schema or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ./server/pnpm-lock.yaml
        - action: rebuild
          path: ./server/prisma/schema.prisma
        - action: rebuild
          path: ./server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      # File events don't reach containers reliably on macOS; poll so `nest start --watch` reloads on edits
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/realtime_chat?directConnection=true
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-chatwave}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@chat.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      MAX_FILE_SIZE_MB: "25"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-uploads}
      MINIO_REGION: us-east-1
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: "3478"
      TURN_USER: ${TURN_USER:-chat}
      TURN_PASSWORD: ${TURN_PASSWORD:-chatpass}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80}
      ALLOW_LAN_ORIGINS: ${ALLOW_LAN_ORIGINS:-true}
    volumes:
      - ./server/src:/app/src
      - ./server/libs:/app/libs
      - ./server/test:/app/test
      - ./server/prisma:/app/prisma
      - ./server/nest-cli.json:/app/nest-cli.json
      - ./server/tsconfig.json:/app/tsconfig.json
      - ./server/tsconfig.build.json:/app/tsconfig.build.json
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      coturn:
        condition: service_started

  client:
    build:
      context: ./client
      target: dev
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./client/pnpm-lock.yaml
        - action: rebuild
          path: ./client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://server:3001
      CHOKIDAR_USEPOLLING: "true"
      VITE_LEGAL_URL: ${VITE_LEGAL_URL:-}
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
    depends_on:
      - server

volumes:
  mongo_data:
  minio_data:
