# Chat frontend (dev). Started from the repo root through ../../docker/docker-compose.dev.yml (it needs the backend and auth services);
# variables come from ./.env (see .env.example).

services:
  chat-app-frontend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/chat-app-frontend"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3003:3003"
    environment:
      API_PROXY_TARGET: http://chat-app-backend:3002
      AUTH_PROXY_TARGET: http://auth:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/repo/apps/chat-app-frontend/src
      - ./public:/repo/apps/chat-app-frontend/public
      - ./index.html:/repo/apps/chat-app-frontend/index.html
      - ./vite.config.ts:/repo/apps/chat-app-frontend/vite.config.ts
      - ./tsconfig.json:/repo/apps/chat-app-frontend/tsconfig.json
    depends_on:
      - chat-app-backend
      - auth
