# Home (dev): the app launcher. Started from the repo root through ../../docker/docker-compose.dev.yml (it needs the auth service);
# variables come from ./.env (see .env.example).

services:
  home:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/home"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      AUTH_PROXY_TARGET: http://auth:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/repo/apps/home/src
      - ./public:/repo/apps/home/public
      - ./index.html:/repo/apps/home/index.html
      - ./vite.config.ts:/repo/apps/home/vite.config.ts
      - ./tsconfig.json:/repo/apps/home/tsconfig.json
    depends_on:
      - auth
