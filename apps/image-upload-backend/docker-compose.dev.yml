# Image upload backend (dev). Owns redis (BullMQ); needs postgres (apps/link-shortener), minio (apps/chat-app-backend) and auth;
# started from the repo root through ../../docker/docker-compose.dev.yml; variables come from ./.env (see .env.example).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  image-upload-backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/image-upload-backend"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/image_upload
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-chatwave}
      MAX_FILE_SIZE_MB: "10"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-image-uploads}
      MINIO_REGION: us-east-1
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3005}
    volumes:
      - ./src:/repo/apps/image-upload-backend/src
      - ./package.json:/repo/apps/image-upload-backend/package.json
      - ./tsconfig.json:/repo/apps/image-upload-backend/tsconfig.json
      - ./eslint.config.js:/repo/apps/image-upload-backend/eslint.config.js
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

volumes:
  redis_data:
