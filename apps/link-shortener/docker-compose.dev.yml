# Link shortener (dev, Next.js) plus its PostgreSQL. Started from the repo root through ../../docker/docker-compose.dev.yml;
# variables come from ./.env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-link_shortener}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-link_shortener}"]
      interval: 10s
      retries: 5

  link-shortener:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/link-shortener"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-link_shortener}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-chatwave}
      AUTH_PROXY_TARGET: http://auth:3001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./src:/repo/apps/link-shortener/src
      - ./public:/repo/apps/link-shortener/public
      - ./next.config.ts:/repo/apps/link-shortener/next.config.ts
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

volumes:
  postgres_data:
