# Image upload frontend (dev). Started from the repo root through ../../docker/docker-compose.dev.yml (it needs its backend and auth);
# variables come from ./.env (see .env.example).

services:
  image-upload-frontend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/image-upload-frontend"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3005:3005"
    environment:
      API_PROXY_TARGET: http://image-upload-backend:3006
      AUTH_PROXY_TARGET: http://auth:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/repo/apps/image-upload-frontend/src
      - ./public:/repo/apps/image-upload-frontend/public
      - ./index.html:/repo/apps/image-upload-frontend/index.html
      - ./vite.config.ts:/repo/apps/image-upload-frontend/vite.config.ts
      - ./tsconfig.json:/repo/apps/image-upload-frontend/tsconfig.json
    depends_on:
      - image-upload-backend
      - auth
