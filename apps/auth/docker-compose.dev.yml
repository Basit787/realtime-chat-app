# Auth service (dev); uses the MongoDB and MinIO started by apps/chat-app-backend's compose file.
# Started from the repo root through ../../docker/docker-compose.dev.yml; variables come from ./.env (see .env.example).

services:
  auth:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: "@chat/auth"
    restart: unless-stopped
    # Shared packages\' dist/ from the packages service (docker/packages.dev.yml)
    volumes_from:
      - packages:ro
    # `make watch` rebuilds this image when dependencies or the Dockerfile change
    develop:
      watch:
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      # Poll so `nest start --watch` reloads on edits from macOS
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/realtime_chat
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-chatwave}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@chat.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-uploads}
      MINIO_REGION: us-east-1
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003,http://localhost:3000,http://localhost:3005,http://localhost:80}
      ALLOW_LAN_ORIGINS: ${ALLOW_LAN_ORIGINS:-true}
    volumes:
      - ./src:/repo/apps/auth/src
      - ./libs:/repo/apps/auth/libs
      - ./package.json:/repo/apps/auth/package.json
      - ./nest-cli.json:/repo/apps/auth/nest-cli.json
      - ./tsconfig.json:/repo/apps/auth/tsconfig.json
      - ./tsconfig.build.json:/repo/apps/auth/tsconfig.build.json
      - ./eslint.config.js:/repo/apps/auth/eslint.config.js
    # MongoDB and MinIO are defined in apps/chat-app-backend's compose file
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
