# Client (prod). Started from the repo root via `make prod` through ../../docker-compose.prod.yml (it depends on the server service);
# variables come from ./.env (see .env.example).

services:
  client:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: prod
      args:
        APP: "@chat/client"
    restart: unless-stopped
    ports:
      - "5176:80"
    environment:
      API_PROXY_TARGET: http://server:3004
    depends_on:
      - server
